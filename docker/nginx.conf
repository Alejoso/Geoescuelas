# Nginx sirve el backend Laravel en :8000 y pasa los .php al contenedor php-fpm.
server {
    listen 8000;
    server_name _;
    root /var/www/public;
    index index.php;

    charset utf-8;
    client_max_body_size 50M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        # "backend" es el nombre del servicio php-fpm en docker-compose
        fastcgi_pass backend:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
